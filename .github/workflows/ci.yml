name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 自检（清单 / 版本 / 语法 / 路由 / 资源）
        run: node tools/check.mjs
      - name: 试打包
        run: node tools/pack-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: dist/
          if-no-files-found: error
